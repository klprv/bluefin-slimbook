name: Cleanup images

on:
  schedule:
    # Weekly cleanup.
    - cron: "30 8 * * 0"
      timezone: "Europe/Paris"

  workflow_dispatch:

permissions: {}

concurrency:
  group: cleanup-images
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      packages: write

    steps:
      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-untagged: 5
          delete-orphaned-images: true