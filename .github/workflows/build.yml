name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Containerfile
      - .github/workflows/build.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}:stable
  BASE_IMAGE: ghcr.io/ublue-os/bluefin-dx:stable

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare QC71 signing material
        env:
          QC71_SIGNING_KEY: ${{ secrets.QC71_SIGNING_KEY }}
          QC71_SIGNING_CERT: ${{ secrets.QC71_SIGNING_CERT }}
        run: |
          set -euo pipefail

          KEY="${RUNNER_TEMP}/qc71-signing.key"
          CERT="${RUNNER_TEMP}/qc71-signing.crt"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && ( -z "${QC71_SIGNING_KEY}" || -z "${QC71_SIGNING_CERT}" ) ]]; then
            echo "Using an ephemeral QC71 signing key for pull-request validation."
            openssl req \
              -new \
              -x509 \
              -newkey rsa:3072 \
              -nodes \
              -sha256 \
              -days 1 \
              -subj "/CN=Bluefin Slimbook QC71 CI/" \
              -keyout "${KEY}" \
              -out "${CERT}"
          else
            if [[ -z "${QC71_SIGNING_KEY}" || -z "${QC71_SIGNING_CERT}" ]]; then
              echo "::error::QC71_SIGNING_KEY and QC71_SIGNING_CERT repository secrets are required."
              exit 1
            fi

            printf '%s\n' "${QC71_SIGNING_KEY}" > "${KEY}"
            printf '%s\n' "${QC71_SIGNING_CERT}" > "${CERT}"
          fi

          chmod 600 "${KEY}" "${CERT}"

          CERT_PUB="$(
            openssl x509 -in "${CERT}" -pubkey -noout |
            openssl pkey -pubin -outform DER |
            sha256sum | cut -d ' ' -f 1
          )"
          KEY_PUB="$(
            openssl pkey -in "${KEY}" -pubout -outform DER |
            sha256sum | cut -d ' ' -f 1
          )"
          [[ "${CERT_PUB}" == "${KEY_PUB}" ]]

          echo "QC71_KEY=${KEY}" >> "${GITHUB_ENV}"
          echo "QC71_CERT=${CERT}" >> "${GITHUB_ENV}"
          echo "QC71_CERT_HASH=$(sha256sum "${CERT}" | cut -d ' ' -f 1)" >> "${GITHUB_ENV}"

      - name: Check for updates
        id: check
        run: |
          set -euo pipefail

          docker pull --platform linux/amd64 "${BASE_IMAGE}"
          BASE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' "${BASE_IMAGE}")"

          docker build \
            --no-cache \
            --progress=plain \
            --platform linux/amd64 \
            --file Containerfile \
            --target inputs \
            --build-arg BASE_IMAGE="${BASE_REF}" \
            --output "type=local,dest=${RUNNER_TEMP}/build-inputs" \
            .

          INPUTS_HASH="$(
            {
              printf '%s\n' "${BASE_REF}"
              printf '%s\n' "${QC71_CERT_HASH}"
              sha256sum Containerfile .github/workflows/build.yml
              cat "${RUNNER_TEMP}/build-inputs/manifest.sha256"
            } | sha256sum | cut -d ' ' -f 1
          )"

          echo "BASE_REF=${BASE_REF}" >> "${GITHUB_ENV}"
          echo "INPUTS_HASH=${INPUTS_HASH}" >> "${GITHUB_ENV}"

          CHANGED=true
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            if docker buildx imagetools inspect "${IMAGE}" \
                --format '{{json .Image}}' > "${RUNNER_TEMP}/published.json"; then
              PREVIOUS="$(
                jq -r                   '(.["linux/amd64"] // .).config.Labels["io.github.klprv.bluefin-slimbook.inputs"] // ""'                   "${RUNNER_TEMP}/published.json"
              )"
              if [[ "${PREVIOUS}" == "${INPUTS_HASH}" ]]; then
                CHANGED=false
              fi
            else
              echo "::warning::No readable stable image; rebuilding conservatively."
            fi
          fi

          echo "changed=${CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "Build required: ${CHANGED}"

      - name: Build image
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail

          docker build \
            --progress=plain \
            --platform linux/amd64 \
            --file Containerfile \
            --build-arg BASE_IMAGE="${BASE_REF}" \
            --build-context "inputs=${RUNNER_TEMP}/build-inputs" \
            --secret "id=qc71_signing_key,src=${QC71_KEY}" \
            --secret "id=qc71_signing_cert,src=${QC71_CERT}" \
            --tag "${IMAGE}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "io.github.klprv.bluefin-slimbook.inputs=${INPUTS_HASH}" \
            .

      - name: Validate container signing key
        if: steps.check.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [[ -z "${SIGNING_SECRET}" ]]; then
            echo "::error::SIGNING_SECRET repository secret is required."
            exit 1
          fi

      - name: Publish image
        if: steps.check.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: docker push "${IMAGE}"

      - name: Install Cosign
        if: steps.check.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        if: steps.check.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}"
