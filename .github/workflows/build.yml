name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Containerfile
      - .github/workflows/build.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  BASE_IMAGE: ghcr.io/projectbluefin/bluefin:stable
  BUILD_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve base image
        run: |
          docker pull --platform linux/amd64 "${BASE_IMAGE}"
          BASE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' "${BASE_IMAGE}")"
          BASE_VERSION="$(docker image inspect "${BASE_REF}" | jq -er '.[0].Config.Labels["org.opencontainers.image.version"] | select(length > 0)')"
          echo "BASE_REF=${BASE_REF}" >> "${GITHUB_ENV}"
          echo "BASE_DIGEST=${BASE_REF#*@}" >> "${GITHUB_ENV}"
          echo "BASE_VERSION=${BASE_VERSION}" >> "${GITHUB_ENV}"

      - name: Resolve package inputs
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            --platform linux/amd64 \
            --file Containerfile \
            --target inputs \
            --build-arg BASE_IMAGE="${BASE_REF}" \
            --output "type=local,dest=${RUNNER_TEMP}/build-inputs" \
            .

          INPUTS_HASH="$(
            {
              printf '%s\n' "${BASE_REF}"
              sha256sum Containerfile .github/workflows/build.yml
              cat "${RUNNER_TEMP}/build-inputs/manifest.sha256"
            } | sha256sum | cut -d ' ' -f 1
          )"
          echo "INPUTS_HASH=${INPUTS_HASH}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check published inputs
        id: check
        run: |
          CHANGED=true
          if [[ "${GITHUB_EVENT_NAME}" != pull_request && "${GITHUB_EVENT_NAME}" != workflow_dispatch ]]; then
            if docker buildx imagetools inspect "${IMAGE}:stable" \
                --format '{{json .Image}}' > "${RUNNER_TEMP}/published.json"; then
              PREVIOUS="$(jq -r '(.["linux/amd64"] // .).config.Labels["io.github.klprv.bluefin-slimbook.inputs"] // ""' "${RUNNER_TEMP}/published.json")"
              if [[ "${PREVIOUS}" == "${INPUTS_HASH}" ]]; then
                CHANGED=false
              fi
            else
              echo '::warning::No readable stable image; rebuilding conservatively.'
            fi
          fi
          echo "changed=${CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "Build required: ${CHANGED}"

      - name: Build image
        if: steps.check.outputs.changed == 'true'
        run: |
          docker build \
            --progress=plain \
            --platform linux/amd64 \
            --file Containerfile \
            --build-arg BASE_IMAGE="${BASE_REF}" \
            --build-context "inputs=${RUNNER_TEMP}/build-inputs" \
            --tag "${IMAGE}:${BUILD_TAG}" \
            --tag "${IMAGE}:stable" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${BASE_VERSION}-${BUILD_TAG}" \
            --label "org.opencontainers.image.base.name=${BASE_IMAGE}" \
            --label "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
            --label "io.github.klprv.bluefin-slimbook.inputs=${INPUTS_HASH}" \
            .

      - name: Publish image
        if: steps.check.outputs.changed == 'true' && env.PUBLISH == 'true'
        run: |
          docker push "${IMAGE}:${BUILD_TAG}"
          docker push "${IMAGE}:stable"
