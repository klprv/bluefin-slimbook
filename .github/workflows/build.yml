name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  BASE_IMAGE: ghcr.io/ublue-os/bluefin-dx:stable
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install Cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Prepare signing keys
        env:
          QC71_SIGNING_KEY: ${{ env.PUBLISH == 'true' && secrets.QC71_SIGNING_KEY || '' }}
          QC71_SIGNING_CERT: ${{ env.PUBLISH == 'true' && secrets.QC71_SIGNING_CERT || '' }}
          SIGNING_SECRET: ${{ env.PUBLISH == 'true' && secrets.SIGNING_SECRET || '' }}
          COSIGN_PASSWORD: ''
        run: |
          set -euo pipefail
          umask 077
          if [[ "${PUBLISH}" == true ]]; then
            for name in QC71_SIGNING_KEY QC71_SIGNING_CERT SIGNING_SECRET; do
              [[ -n "${!name}" ]] || { echo "::error::Missing secret: ${name}"; exit 1; }
            done
            printf '%s\n' "${QC71_SIGNING_KEY}" > "${RUNNER_TEMP}/qc71.key"
            printf '%s\n' "${QC71_SIGNING_CERT}" > "${RUNNER_TEMP}/qc71.crt"
            printf '%s\n' "${SIGNING_SECRET}" > "${RUNNER_TEMP}/cosign.key"
            cosign public-key --key "${RUNNER_TEMP}/cosign.key" > "${RUNNER_TEMP}/cosign.pub"
          else
            # PRs exercise signing without receiving production keys or publishing.
            openssl req -new -x509 -newkey rsa:3072 -noenc -sha256 \
              -days 1 -subj '/CN=QC71 CI test only/' \
              -keyout "${RUNNER_TEMP}/qc71.key" -out "${RUNNER_TEMP}/qc71.crt"
          fi
          openssl x509 -in "${RUNNER_TEMP}/qc71.crt" -checkend 0 -noout
          openssl x509 -in "${RUNNER_TEMP}/qc71.crt" -outform DER -out "${RUNNER_TEMP}/qc71.der"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check inputs
        id: check
        run: |
          set -euo pipefail
          BASE_DIGEST="$(docker buildx imagetools inspect "${BASE_IMAGE}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "${BASE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          BASE_REF="${BASE_IMAGE%:*}@${BASE_DIGEST}"

          docker buildx build --pull --no-cache --progress=plain \
            --platform linux/amd64 --provenance=false \
            --file Containerfile --target inputs \
            --build-arg "BASE_IMAGE=${BASE_REF}" \
            --output "type=local,dest=${RUNNER_TEMP}/build-inputs" .

          INPUTS_DIGEST="$(
            {
              printf '%s\n' "${BASE_REF}"
              sha256sum Containerfile .github/workflows/build.yml
              cat "${RUNNER_TEMP}/build-inputs/manifest.sha256"
              # Hash public material using stable relative paths, never private keys.
              (cd "${RUNNER_TEMP}"; sha256sum qc71.der; \
                if [[ -f cosign.pub ]]; then sha256sum cosign.pub; fi)
            } | sha256sum | cut -d ' ' -f 1
          )"

          CHANGED=true
          if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            if docker buildx imagetools inspect "${IMAGE}:stable" \
                --format '{{json .Image}}' > "${RUNNER_TEMP}/stable.json"; then
              PREVIOUS="$(jq -r \
                '(.["linux/amd64"] // .).config.Labels["io.github.klprv.bluefin-slimbook.inputs"] // ""' \
                "${RUNNER_TEMP}/stable.json")"
              [[ "${PREVIOUS}" != "${INPUTS_DIGEST}" ]] || CHANGED=false
            else
              echo "::warning::Cannot read stable; building rather than assuming it is current."
            fi
          fi

          {
            echo "changed=${CHANGED}"
            echo "base=${BASE_REF}"
            echo "digest=${INPUTS_DIGEST}"
          } >> "${GITHUB_OUTPUT}"
          printf 'Build required: **%s**\n\nBase: `%s`\n\nInputs: `%s`\n' \
            "${CHANGED}" "${BASE_REF}" "${INPUTS_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build
        if: steps.check.outputs.changed == 'true'
        env:
          BASE_REF: ${{ steps.check.outputs.base }}
          INPUTS_DIGEST: ${{ steps.check.outputs.digest }}
        run: |
          set -euo pipefail
          OUTPUT=type=cacheonly
          if [[ "${PUBLISH}" == true ]]; then
            OUTPUT="type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true"
          fi
          # Reuse the exact RPMs checked above; do not resolve them a second time.
          docker buildx build --pull --no-cache --progress=plain \
            --platform linux/amd64 --provenance=false \
            --file Containerfile --target final \
            --build-arg "BASE_IMAGE=${BASE_REF}" \
            --build-context "inputs=${RUNNER_TEMP}/build-inputs" \
            --secret "id=qc71_signing_key,src=${RUNNER_TEMP}/qc71.key" \
            --secret "id=qc71_signing_cert,src=${RUNNER_TEMP}/qc71.crt" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.base.name=${BASE_IMAGE}" \
            --label "org.opencontainers.image.base.digest=${BASE_REF##*@}" \
            --label "io.github.klprv.bluefin-slimbook.inputs=${INPUTS_DIGEST}" \
            --metadata-file "${RUNNER_TEMP}/image.json" \
            --output "${OUTPUT}" .

      - name: Sign, verify and publish stable
        if: steps.check.outputs.changed == 'true' && env.PUBLISH == 'true'
        env:
          COSIGN_PASSWORD: ''
        run: |
          set -euo pipefail
          DIGEST="$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/image.json")"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          REF="${IMAGE}@${DIGEST}"
          # Preserve the signature format used by containers/image and bootc.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --key "${RUNNER_TEMP}/cosign.key" "${REF}"
          cosign verify --new-bundle-format=false \
            --key "${RUNNER_TEMP}/cosign.pub" "${REF}" > /dev/null
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE}:stable" "${REF}"
          printf '\nPublished `%s:stable` → `%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary keys
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/qc71.key" "${RUNNER_TEMP}/qc71.crt" \
            "${RUNNER_TEMP}/qc71.der" "${RUNNER_TEMP}/cosign.key" "${RUNNER_TEMP}/cosign.pub"
