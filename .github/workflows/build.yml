name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  BASE_IMAGE: ghcr.io/ublue-os/bluefin-dx:stable
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install Cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check inputs
        id: check
        env:
          QC71_SIGNING_CERT: ${{ env.PUBLISH == 'true' && secrets.QC71_SIGNING_CERT || '' }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH}" == true ]]; then
            : "${QC71_SIGNING_CERT:?Missing QC71_SIGNING_CERT secret}"
            printf '%s\n' "${QC71_SIGNING_CERT}" | openssl x509 -checkend 0 -noout
            printf '%s\n' "${QC71_SIGNING_CERT}" | openssl x509 -outform DER \
              -out "${RUNNER_TEMP}/qc71.der"
          fi

          BASE_DIGEST="$(docker buildx imagetools inspect "${BASE_IMAGE}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "${BASE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          BASE_REF="${BASE_IMAGE%:*}@${BASE_DIGEST}"

          docker buildx build --pull --no-cache --progress=plain \
            --platform linux/amd64 --provenance=false \
            --file Containerfile --target inputs \
            --build-arg "BASE_IMAGE=${BASE_REF}" \
            --output "type=local,dest=${RUNNER_TEMP}/build-inputs" .

          INPUTS_DIGEST="$(
            {
              printf '%s\n' "${BASE_REF}"
              sha256sum Containerfile .github/workflows/build.yml
              cat "${RUNNER_TEMP}/build-inputs/manifest.sha256"
              if [[ "${PUBLISH}" == true ]]; then
                (cd "${RUNNER_TEMP}" && sha256sum qc71.der)
              fi
            } | sha256sum | cut -d ' ' -f 1
          )"

          # Only scheduled runs may skip; push, PR and manual runs always build.
          CHANGED=true
          if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            if PREVIOUS_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:stable" \
                --format '{{json .Manifest}}' | jq -er '.digest')" && \
               [[ "${PREVIOUS_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] && \
               cosign verify --new-bundle-format=false \
                --certificate-identity "${CERTIFICATE_IDENTITY}" \
                --certificate-oidc-issuer "${OIDC_ISSUER}" \
                "${IMAGE}@${PREVIOUS_DIGEST}" > /dev/null; then
              PREVIOUS="$(docker buildx imagetools inspect "${IMAGE}@${PREVIOUS_DIGEST}" \
                --format '{{json .Image}}' | jq -r \
                '(.["linux/amd64"] // .).config.Labels["io.github.klprv.bluefin-slimbook.inputs"] // ""')"
              [[ "${PREVIOUS}" != "${INPUTS_DIGEST}" ]] || CHANGED=false
            else
              echo '::notice::No verified stable image available; rebuilding.'
            fi
          fi

          {
            echo "changed=${CHANGED}"
            echo "base=${BASE_REF}"
            echo "digest=${INPUTS_DIGEST}"
          } >> "${GITHUB_OUTPUT}"
          printf 'Build required: **%s**\n\nBase: `%s`\n\nInputs: `%s`\n' \
            "${CHANGED}" "${BASE_REF}" "${INPUTS_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build
        if: steps.check.outputs.changed == 'true'
        env:
          BASE_REF: ${{ steps.check.outputs.base }}
          INPUTS_DIGEST: ${{ steps.check.outputs.digest }}
          QC71_SIGNING_KEY: ${{ env.PUBLISH == 'true' && secrets.QC71_SIGNING_KEY || '' }}
          QC71_SIGNING_CERT: ${{ env.PUBLISH == 'true' && secrets.QC71_SIGNING_CERT || '' }}
        run: |
          set -euo pipefail
          OUTPUT=type=cacheonly
          SECRETS=()
          if [[ "${PUBLISH}" == true ]]; then
            : "${QC71_SIGNING_KEY:?Missing QC71_SIGNING_KEY secret}"
            : "${QC71_SIGNING_CERT:?Missing QC71_SIGNING_CERT secret}"
            OUTPUT="type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true"
            SECRETS=(
              --secret id=qc71_signing_key,env=QC71_SIGNING_KEY
              --secret id=qc71_signing_cert,env=QC71_SIGNING_CERT
            )
          fi

          # Reuse the checked RPM snapshot. PRs have no secrets and publish nothing.
          docker buildx build --pull --no-cache --progress=plain \
            --platform linux/amd64 --provenance=false \
            --file Containerfile --target final \
            --build-arg "BASE_IMAGE=${BASE_REF}" \
            --build-arg "QC71_SIGN=${PUBLISH}" \
            --build-context "inputs=${RUNNER_TEMP}/build-inputs" \
            "${SECRETS[@]}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.base.name=${BASE_IMAGE}" \
            --label "org.opencontainers.image.base.digest=${BASE_REF##*@}" \
            --label "io.github.klprv.bluefin-slimbook.inputs=${INPUTS_DIGEST}" \
            --metadata-file "${RUNNER_TEMP}/image.json" \
            --output "${OUTPUT}" .

      - name: Sign, verify and publish stable
        if: steps.check.outputs.changed == 'true' && env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          DIGEST="$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/image.json")"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          REF="${IMAGE}@${DIGEST}"

          # Keyless GitHub OIDC; retain the format understood by containers/image.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "${REF}"
          cosign verify --new-bundle-format=false \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" "${REF}" > /dev/null
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE}:stable" "${REF}"
          printf '\nPublished `%s:stable` → `%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
