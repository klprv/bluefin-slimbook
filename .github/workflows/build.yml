name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  BASE_IMAGE: ghcr.io/ublue-os/bluefin-dx:stable
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps: &build_steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare test key
        if: github.event_name == 'pull_request'
        run: |
          umask 077
          openssl req -new -x509 -newkey rsa:3072 -noenc -sha256 \
            -days 1 -subj '/CN=QC71 CI test only/' \
            -keyout "${RUNNER_TEMP}/qc71.key" \
            -out "${RUNNER_TEMP}/qc71.crt"

      - name: Prepare release keys
        if: github.event_name != 'pull_request'
        env:
          QC71_SIGNING_KEY: ${{ secrets.QC71_SIGNING_KEY }}
          QC71_SIGNING_CERT: ${{ secrets.QC71_SIGNING_CERT }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          for name in QC71_SIGNING_KEY QC71_SIGNING_CERT SIGNING_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret: ${name}"
              exit 1
            fi
          done
          printf '%s\n' "${QC71_SIGNING_KEY}" > "${RUNNER_TEMP}/qc71.key"
          printf '%s\n' "${QC71_SIGNING_CERT}" > "${RUNNER_TEMP}/qc71.crt"
          printf '%s\n' "${SIGNING_SECRET}" > "${RUNNER_TEMP}/cosign.key"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          set -euo pipefail
          BASE_DIGEST="$(docker buildx imagetools inspect "${BASE_IMAGE}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "${BASE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          BASE_REF="${BASE_IMAGE%:*}@${BASE_DIGEST}"

          OUTPUT=type=cacheonly
          if [[ "${GITHUB_EVENT_NAME}" != pull_request ]]; then
            OUTPUT="type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true"
          fi

          docker buildx build --pull --no-cache --progress=plain \
            --platform linux/amd64 --provenance=false \
            --file Containerfile --target final \
            --build-arg "BASE_IMAGE=${BASE_REF}" \
            --secret "id=qc71_signing_key,src=${RUNNER_TEMP}/qc71.key" \
            --secret "id=qc71_signing_cert,src=${RUNNER_TEMP}/qc71.crt" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.base.name=${BASE_IMAGE}" \
            --label "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
            --metadata-file "${RUNNER_TEMP}/image.json" \
            --output "${OUTPUT}" .

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign, verify and promote stable
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PASSWORD: ''
        run: |
          set -euo pipefail
          DIGEST="$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/image.json")"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          REF="${IMAGE}@${DIGEST}"
          cosign public-key --key "${RUNNER_TEMP}/cosign.key" > "${RUNNER_TEMP}/cosign.pub"

          # Legacy signature format is required by containers/image (bootc).
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            --key "${RUNNER_TEMP}/cosign.key" "${REF}"
          cosign verify --new-bundle-format=false \
            --key "${RUNNER_TEMP}/cosign.pub" "${REF}" > /dev/null
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE}:stable" "${REF}"
          printf 'Published `%s`\n' "${REF}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary keys
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/qc71.key" "${RUNNER_TEMP}/qc71.crt" \
            "${RUNNER_TEMP}/cosign.key" "${RUNNER_TEMP}/cosign.pub"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps: *build_steps
