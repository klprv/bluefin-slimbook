name: Build image

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 8 * * 2"
      timezone: "Europe/Paris"

  workflow_dispatch:

permissions: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    name: Build Bluefin Slimbook
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}:testing
          secrets: |
            "qc71_signing_key=${{ secrets.QC71_SIGNING_KEY }}"